plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.mateusz.clockadbprobe'
    compileSdk 34

    defaultConfig {
        applicationId "pl.mateusz.clockadbprobe"
        minSdk 24
        // targetSdk 27: keeps hidden-API reflection available (enforcement starts
        // for apps targeting 28+) and matches the Smart Clock 2 era platform.
        targetSdk 27
        versionCode 31
        versionName "2.18"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No runtime dependencies: no AndroidX, no Kotlin, no trackers.
    testImplementation 'junit:junit:4.13.2'
}
